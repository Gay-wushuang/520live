    <text x="217" y="125" fill="#667380" font-size="14" font-weight="400" text-anchor="start" dominant-baseline="middle">1 / 2 · 50%</text>
    <rect x="217" y="146" width="196" height="8" rx="4" fill="#E6EAEE" stroke="none" stroke-width="1" />
    <rect x="217" y="146" width="98" height="8" rx="4" fill="#364A60" stroke="none" stroke-width="1" />
    <text x="217" y="177" fill="#667380" font-size="12" font-weight="400" text-anchor="start" dominant-baseline="middle">下一目标：壁纸解锁</text>
  </g>
