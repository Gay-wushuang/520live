  <style>text { font-family: Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif; }</style>
  <rect x="0" y="0" width="390" height="844" fill="#F3F5F7" id="ARTBOARD-BACKGROUND" data-layer="10-layout" />
