<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" version="1.1" data-design-system="520live-functional-v1" data-artboard="OVL-WALL-02-desktop" data-context="variant" data-viewport="1440x900">
  <title>OVL-WALL-02-desktop — 520live 功能型结构稿</title>
  <desc>静态功能与状态映射；所有可见几何/文字为原生 SVG，未实现业务事件。</desc>
  <style>text { font-family: Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif; }</style>
  <rect x="0" y="0" width="1440" height="900" fill="#F3F5F7" id="ARTBOARD-BACKGROUND" data-layer="10-layout" />
  <g id="OVERLAY-BACKDROP" data-func="OVL-F08" data-state="modal" data-layer="50-overlays">
    <rect x="0" y="0" width="1440" height="900" fill="#24313F" fill-opacity="0.34" />
  </g>
  <g id="OVERLAY-MODAL" data-func="OVL-F08" data-layer="10-layout">
    <rect x="392.0" y="120.0" width="656" height="660" rx="12" fill="#FFFFFF" stroke="#CFD5DA" stroke-width="1" />
    <text x="410.0" y="148.0" fill="#24313F" font-size="16" font-weight="700" text-anchor="start" dominant-baseline="middle">终极奖励</text>
    <text x="410.0" y="171.0" fill="#667380" font-size="11" font-weight="400" text-anchor="start" dominant-baseline="middle">双图壁纸弹窗</text>
    <g id="OVERLAY-CLOSE" data-func="OVL-F08" data-state="default" data-layer="30-controls">
      <rect x="987.0" y="134.0" width="44" height="42" rx="8" fill="#F8F9FA" stroke="#CFD5DA" stroke-width="1" />
      <text x="1009.0" y="156.0" fill="#24313F" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="middle">×</text>
    </g>
    <g id="OVERLAY-PHASE" data-func="OVL-F08" data-layer="40-status">
      <rect x="412.0" y="196.0" width="616" height="26" rx="6" fill="#F8F9FA" stroke="#E6EAEE" stroke-width="1" />
      <text x="422.0" y="209.0" fill="#24313F" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle">双图壁纸弹窗</text>
    </g>
    <g id="OVERLAY-REWARD-ARTWORK" data-func="OVL-F08" data-state="placeholder" data-layer="20-content">
      <rect x="416.0" y="270.0" width="296.0" height="220" rx="8" fill="#F8F9FA" stroke="#CFD5DA" stroke-width="1" />
      <rect x="728.0" y="270.0" width="296.0" height="220" rx="8" fill="#F8F9FA" stroke="#CFD5DA" stroke-width="1" />
    </g>
    <text x="564.0" y="368.0" fill="#667380" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">季节壁纸图占位</text>
    <text x="876.0" y="368.0" fill="#667380" font-size="12" font-weight="400" text-anchor="middle" dominant-baseline="middle">电脑壁纸图占位</text>
    <text x="564.0" y="512.0" fill="#24313F" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle">季节壁纸 · 已解锁</text>
    <text x="876.0" y="512.0" fill="#24313F" font-size="12" font-weight="600" text-anchor="middle" dominant-baseline="middle">夏秋双面折扇</text>
    <text x="720.0" y="550.0" fill="#24313F" font-size="15" font-weight="700" text-anchor="middle" dominant-baseline="middle">终极大奖已解锁 · 双图展示</text>
    <text x="720.0" y="578.0" fill="#667380" font-size="11" font-weight="400" text-anchor="middle" dominant-baseline="middle">指针命中与季节信息来自奖励数据；领取后进入终极视频层</text>
    <g id="OVERLAY-CONTINUE" data-func="OVL-F08" data-state="default" data-layer="30-controls">
      <rect x="416.0" y="712.0" width="608" height="48" rx="8" fill="#364A60" stroke="#364A60" stroke-width="1" />
      <text x="720.0" y="737.0" fill="#FFFFFF" font-size="13" font-weight="650" text-anchor="middle" dominant-baseline="middle">领取终极奖励</text>
    </g>
  </g>
</svg>