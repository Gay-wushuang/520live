<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" version="1.1" data-design-system="520live-functional-v1" data-artboard="OVL-WALL-01-MOBILE" data-context="overlay" data-viewport="390x844">
  <title>OVL-WALL-01-MOBILE — 520live 功能型结构稿</title>
