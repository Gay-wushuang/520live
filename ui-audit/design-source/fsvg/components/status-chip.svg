<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="440" height="240" viewBox="0 0 440 240" version="1.1" data-design-system="520live-functional-v1" data-artboard="COMPONENT-STATUS-CHIP" data-context="base" data-viewport="440x240">
  <title>COMPONENT-STATUS-CHIP — 520live 功能型结构稿</title>
  <desc>静态功能与状态映射；所有可见几何/文字为原生 SVG，未实现业务事件。</desc>
  <style>text { font-family: Noto Sans CJK SC, Microsoft YaHei, PingFang SC, sans-serif; }</style>
  <rect x="0" y="0" width="440" height="240" fill="#F3F5F7" id="ARTBOARD-BACKGROUND" data-layer="10-layout" />
  <text x="24" y="31" fill="#24313F" font-size="18" font-weight="700" text-anchor="start" dominant-baseline="middle">STATUS-CHIP</text>
  <g id="COMP-CHIP-DEFAULT" data-layer="40-status">
    <rect x="24" y="80" width="186" height="26" rx="6" fill="#F8F9FA" stroke="#E6EAEE" stroke-width="1" />
    <text x="34" y="93" fill="#24313F" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle">当前状态：就绪</text>
  </g>
  <g id="COMP-CHIP-PENDING" data-layer="40-status">
    <rect x="226" y="80" width="190" height="26" rx="6" fill="#F8F9FA" stroke="#E6EAEE" stroke-width="1" />
    <text x="236" y="93" fill="#24313F" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle">处理中 / 加载中</text>
  </g>
  <g id="COMP-CHIP-ERROR" data-layer="40-status">
    <rect x="24" y="132" width="392" height="26" rx="6" fill="#F8F9FA" stroke="#E6EAEE" stroke-width="1" />
    <text x="34" y="145" fill="#24313F" font-size="11" font-weight="500" text-anchor="start" dominant-baseline="middle">失败原因：操作被拒绝</text>
  </g>
</svg>